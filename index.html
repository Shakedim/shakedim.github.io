<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHAKEDIM</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #0b0b0f;
            color: white;

            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .name {
            font-size: 42px;
            font-weight: 800;

            letter-spacing: 3px;

            margin-bottom: 8px;
        }

        .bio {
            color: #aaa;

            font-size: 16px;

            margin-bottom: 35px;
        }

        .links {
            display: flex;
            flex-direction: column;

            gap: 14px;
        }

        .link {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 100%;

            padding: 17px;

            background: #18181f;

            border: 1px solid #292933;

            border-radius: 14px;

            color: white;

            text-decoration: none;

            font-size: 16px;
            font-weight: 700;

            letter-spacing: 1px;

            transition: all 0.2s ease;
        }

        .link:hover {
            transform: translateY(-3px);

            background: #22222c;

            border-color: #444451;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="name">
            SHAKEDIM
        </div>

        <div class="bio">
            Streamer & Content Creator
        </div>

        <div class="links">

            <!-- KICK -->
            <a
                class="link"
                href="https://kick.com/shakedim"
                target="_blank"
                rel="noopener noreferrer">
                KICK
            </a>


            <!-- INSTAGRAM -->
            <a
                class="link"
                href="https://www.instagram.com/shakedimm"
                target="_blank"
                rel="noopener noreferrer">
                INSTAGRAM
            </a>


            <!-- TIKTOK -->
            <a
                class="link"
                href="https://www.tiktok.com/@shakedimm"
                target="_blank"
                rel="noopener noreferrer">
                TIKTOK
            </a>


            <!-- YOUTUBE -->
            <a
                class="link"
                href="https://www.youtube.com/Shakedim"
                target="_blank"
                rel="noopener noreferrer">
                YOUTUBE
            </a>


            <!-- DISCORD -->
            <a
                class="link"
                href="https://discord.gg/djW2w2ZWRT"
                target="_blank"
                rel="noopener noreferrer">
                DISCORD
            </a>


            <!-- TIPS -->
            <a
                class="link"
                href="https://botrix.live/k/shakedim/tip"
                target="_blank"
                rel="noopener noreferrer">
                TIPS
            </a>

        </div>

    </div>

</body>

</html>
