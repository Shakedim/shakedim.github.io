<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHAKEDIM | Links</title>

    <meta name="description" content="SHAKEDIM - Streamer & Content Creator">

    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =========================================
           BODY / BACKGROUND
        ========================================= */

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #ffffff;

            background:
                radial-gradient(
                    circle at 50% 10%,
                    rgba(150, 0, 255, 0.25),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 15% 80%,
                    rgba(0, 100, 255, 0.18),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 90% 70%,
                    rgba(255, 0, 200, 0.15),
                    transparent 35%
                ),

                #05030d;

            display: flex;
            justify-content: center;

            padding: 35px 15px;

            overflow-x: hidden;

            position: relative;
        }


        /* =========================================
           GEOMETRIC BACKGROUND
        ========================================= */

        body::before {
            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            opacity: 0.35;

            background-image:
                linear-gradient(
                    135deg,
                    rgba(130, 0, 255, 0.20) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    45deg,
                    rgba(255, 0, 220, 0.13) 1px,
                    transparent 1px
                );

            background-size:
                42px 42px,
                42px 42px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 95%
                );
        }


        /* =========================================
           MAIN CARD
        ========================================= */

        .page {
            width: 100%;

            max-width: 500px;

            position: relative;

            z-index: 2;

            padding: 42px 25px 35px;

            border-radius: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(27, 8, 47, 0.96),
                    rgba(9, 5, 20, 0.97)
                );

            border: 1px solid rgba(190, 70, 255, 0.28);

            box-shadow:
                0 0 40px rgba(115, 0, 255, 0.20),
                0 0 100px rgba(255, 0, 220, 0.08),
                inset 0 0 40px rgba(100, 0, 180, 0.05);

            backdrop-filter: blur(18px);

            min-height: 800px;
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo-wrapper {
            display: flex;

            justify-content: center;

            margin-bottom: 18px;
        }

        .logo-ring {
            width: 150px;
            height: 150px;

            border-radius: 50%;

            display: flex;

            justify-content: center;
            align-items: center;

            position: relative;

            background:
                radial-gradient(
                    circle,
                    rgba(120, 0, 255, 0.35),
                    rgba(15, 5, 30, 0.95) 65%
                );

            border: 3px solid #b400ff;

            box-shadow:
                0 0 10px #b400ff,
                0 0 25px #b400ff,
                0 0 55px rgba(255, 0, 220, 0.55);

            animation: logoGlow 3s ease-in-out infinite;
        }

        .logo-ring::before {
            content: "";

            position: absolute;

            inset: -8px;

            border-radius: 50%;

            border: 1px solid rgba(0, 220, 255, 0.8);

            box-shadow:
                0 0 15px rgba(0, 220, 255, 0.8);

            pointer-events: none;
        }

        .logo {
            width: 125px;
            height: 125px;

            object-fit: contain;

            border-radius: 50%;
        }

        @keyframes logoGlow {

            0%,
            100% {
                box-shadow:
                    0 0 10px #b400ff,
                    0 0 25px #b400ff,
                    0 0 55px rgba(255, 0, 220, 0.45);
            }

            50% {
                box-shadow:
                    0 0 15px #d000ff,
                    0 0 35px #d000ff,
                    0 0 75px rgba(0, 180, 255, 0.5);
            }
        }


        /* =========================================
           NAME
        ========================================= */

        .name {
            text-align: center;

            font-size: clamp(36px, 9vw, 52px);

            font-weight: 900;

            letter-spacing: 3px;

            margin-top: 10px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #e6c7ff,
                    #ffffff
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            text-shadow:
                0 0 20px rgba(180, 0, 255, 0.5);
        }


        /* =========================================
           BIO
        ========================================= */

        .bio {
            text-align: center;

            margin-top: 8px;

            color: #c9b9d8;

            font-size: 15px;

            line-height: 1.5;

            letter-spacing: 0.4px;
        }


        /* =========================================
           LIVE BADGE
        ========================================= */

        .live-wrapper {
            display: flex;

            justify-content: center;

            margin: 24px 0 27px;
        }

        .live {
            display: inline-flex;

            align-items: center;

            gap: 9px;

            padding: 9px 20px;

            border-radius: 999px;

            border: 1px solid rgba(255, 60, 100, 0.8);

            background:
                rgba(255, 30, 70, 0.08);

            color: #ff6b83;

            font-size: 13px;

            font-weight: 800;

            letter-spacing: 1.5px;

            box-shadow:
                0 0 18px rgba(255, 30, 70, 0.18);
        }

        .live-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: #ff3158;

            box-shadow:
                0 0 10px #ff3158;

            animation: livePulse 1.3s infinite;
        }

        @keyframes livePulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.45;
                transform: scale(0.75);
            }
        }


        /* =========================================
           LINKS
        ========================================= */

        .links {
            display: flex;

            flex-direction: column;

            gap: 14px;
        }


        /* =========================================
           LINK BUTTON
        ========================================= */

        .link {
            position: relative;

            display: flex;

            align-items: center;

            width: 100%;

            min-height: 72px;

            padding: 10px 15px;

            text-decoration: none;

            color: white;

            border-radius: 15px;

            overflow: hidden;

            border: 1px solid rgba(255, 255, 255, 0.16);

            background:
                linear-gradient(
                    100deg,
                    rgba(255,255,255,0.07),
                    rgba(255,255,255,0.025)
                );

            box-shadow:
                inset 0 0 20px rgba(255,255,255,0.025),
                0 5px 20px rgba(0,0,0,0.25);

            transition:
                transform 0.22s ease,
                box-shadow 0.22s ease,
                border-color 0.22s ease,
                background 0.22s ease;
        }


        /* Shine effect */

        .link::before {
            content: "";

            position: absolute;

            top: 0;
            left: -120%;

            width: 80%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.12),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left 0.6s ease;
        }

        .link:hover::before {
            left: 140%;
        }


        .link:hover {
            transform: translateY(-3px) scale(1.01);

            border-color:
                rgba(220, 100, 255, 0.65);

            box-shadow:
                0 8px 30px rgba(110, 0, 255, 0.25),
                0 0 20px rgba(210, 0, 255, 0.12);
        }


        /* =========================================
           ICON
        ========================================= */

        .icon {
            width: 50px;
            height: 50px;

            flex-shrink: 0;

            border-radius: 12px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 24px;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.13);

            box-shadow:
                inset 0 0 15px rgba(255,255,255,0.04);
        }


        /* =========================================
           TEXT
        ========================================= */

        .link-text {
            flex: 1;

            text-align: center;

            font-size: 18px;

            font-weight: 800;

            letter-spacing: 0.5px;

            margin-left: 10px;
        }


        /* =========================================
           RIGHT SIDE LABEL
        ========================================= */

        .status {
            min-width: 55px;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 6px 10px;

            border-radius: 999px;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 0.5px;

            border: 1px solid rgba(255,255,255,0.25);

            background: rgba(255,255,255,0.06);
        }


        /* =========================================
           INDIVIDUAL PLATFORM COLORS
        ========================================= */

        .kick {
            border-color: rgba(70, 255, 50, 0.45);
            background:
                linear-gradient(
                    100deg,
                    rgba(0, 100, 30, 0.35),
                    rgba(10, 30, 15, 0.75)
                );
        }

        .kick:hover {
            border-color: #45ff45;

            box-shadow:
                0 0 25px rgba(60,255,60,0.25);
        }

        .kick .icon {
            color: #59ff59;

            box-shadow:
                0 0 18px rgba(60,255,60,0.18);
        }


        .discord {
            border-color: rgba(140, 150, 255, 0.55);

            background:
                linear-gradient(
                    100deg,
                    rgba(70, 70, 180, 0.42),
                    rgba(30, 25, 80, 0.75)
                );
        }

        .discord:hover {
            border-color: #8f9cff;

            box-shadow:
                0 0 28px rgba(100,110,255,0.28);
        }

        .discord .icon {
            color: #aab2ff;
        }


        .tiktok {
            border-color: rgba(80, 220, 255, 0.4);

            background:
                linear-gradient(
                    100deg,
                    rgba(20, 25, 35, 0.95),
                    rgba(5, 15, 20, 0.9)
                );
        }

        .tiktok:hover {
            border-color: #55eaff;

            box-shadow:
                0 0 28px rgba(50,220,255,0.2);
        }

        .tiktok .icon {
            color: #ffffff;

            text-shadow:
                2px 2px 0 #ff1f8f,
                -2px -2px 0 #00eaff;
        }


        .instagram {
            border-color: rgba(255, 70, 180, 0.42);

            background:
                linear-gradient(
                    100deg,
                    rgba(100, 15, 80, 0.38),
                    rgba(35, 10, 40, 0.75)
                );
        }

        .instagram:hover {
            border-color: #ff4bc4;

            box-shadow:
                0 0 28px rgba(255,40,180,0.25);
        }

        .instagram .icon {
            color: #ff6bd1;
        }


        .youtube {
            border-color: rgba(255, 60, 70, 0.4);

            background:
                linear-gradient(
                    100deg,
                    rgba(110, 15, 20, 0.4),
                    rgba(40, 10, 15, 0.8)
                );
        }

        .youtube:hover {
            border-color: #ff4754;

            box-shadow:
                0 0 28px rgba(255,40,50,0.25);
        }

        .youtube .icon {
            color: #ff5964;
        }


        .tips {
            border-color: rgba(255, 190, 50, 0.4);

            background:
                linear-gradient(
                    100deg,
                    rgba(90, 60, 10, 0.42),
                    rgba(35, 25, 8, 0.8)
                );
        }

        .tips:hover {
            border-color: #ffd34d;

            box-shadow:
                0 0 28px rgba(255,190,40,0.2);
        }

        .tips .icon {
            color: #ffd65a;
        }


        /* =========================================
           FOOTER
        ========================================= */

        .footer {
            text-align: center;

            margin-top: 30px;

            color: rgba(255,255,255,0.35);

            font-size: 11px;

            letter-spacing: 2px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 520px) {

            body {
                padding: 15px 10px;
            }

            .page {
                padding: 32px 17px 28px;

                border-radius: 25px;

                min-height: auto;
            }

            .logo-ring {
                width: 130px;
                height: 130px;
            }

            .logo {
                width: 108px;
                height: 108px;
            }

            .name {
                font-size: 36px;
            }

            .bio {
                font-size: 14px;
            }

            .link {
                min-height: 67px;
            }

            .icon {
                width: 46px;
                height: 46px;
            }

            .link-text {
                font-size: 16px;
            }

            .status {
                font-size: 9px;
                padding: 5px 8px;
            }
        }

    </style>

</head>


<body>
