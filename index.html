<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHAKEDIM</title>

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            overflow-x: hidden;

            background:
                radial-gradient(
                    ellipse at 50% -10%,
                    rgba(177, 56, 255, 0.34),
                    transparent 38%
                ),
                radial-gradient(
                    ellipse at 0% 80%,
                    rgba(48, 86, 255, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    ellipse at 100% 65%,
                    rgba(255, 44, 200, 0.13),
                    transparent 32%
                ),
                #05030a;
        }


        /* =====================================================
           TOPOGRAPHIC BACKGROUND
        ===================================================== */

        .background {
            position: fixed;
            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 0;
        }


        /*
           Large topographic contour pattern
        */

        .topography {
            position: absolute;

            width: 1500px;
            height: 1100px;

            left: 50%;
            top: 48%;

            transform:
                translate(-50%, -50%)
                rotate(-8deg);

            opacity: 0.42;

            background-image:
                repeating-radial-gradient(
                    ellipse at center,
                    transparent 0,
                    transparent 34px,
                    rgba(183, 71, 255, 0.13) 35px,
                    transparent 36px,
                    transparent 66px
                );

            filter:
                blur(0.15px);

            mask-image:
                radial-gradient(
                    ellipse,
                    black 10%,
                    rgba(0,0,0,0.8) 45%,
                    transparent 78%
                );

            animation: topoMove 18s ease-in-out infinite alternate;
        }


        @keyframes topoMove {

            0% {
                transform:
                    translate(-50%, -50%)
                    rotate(-8deg)
                    scale(1);
            }

            100% {
                transform:
                    translate(-50%, -48%)
                    rotate(-5deg)
                    scale(1.07);
            }
        }


        /*
           Second contour layer
        */

        .topography.two {
            width: 1000px;
            height: 900px;

            left: 12%;
            top: 75%;

            opacity: 0.25;

            transform:
                translate(-50%, -50%)
                rotate(25deg);

            background-image:
                repeating-radial-gradient(
                    ellipse at center,
                    transparent 0,
                    transparent 28px,
                    rgba(63, 130, 255, 0.18) 29px,
                    transparent 30px,
                    transparent 58px
                );

            animation:
                topoMoveTwo 22s ease-in-out infinite alternate;
        }


        @keyframes topoMoveTwo {

            from {
                transform:
                    translate(-50%, -50%)
                    rotate(25deg)
                    scale(1);
            }

            to {
                transform:
                    translate(-48%, -52%)
                    rotate(20deg)
                    scale(1.12);
            }
        }


        /*
           Fine grid
        */

        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(180, 80, 255, 0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(180, 80, 255, 0.035) 1px,
                    transparent 1px
                );

            background-size: 55px 55px;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 20%,
                    black 80%,
                    transparent
                );
        }


        /*
           Ambient glow
        */

        .glow {
            position: absolute;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(170, 0, 255, 0.13),
                    transparent 68%
                );

            filter: blur(25px);

            left: 50%;
            top: 25%;

            transform: translate(-50%, -50%);

            animation: glowPulse 7s ease-in-out infinite;
        }


        @keyframes glowPulse {

            0%, 100% {
                opacity: 0.65;
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            50% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(1.18);
            }
        }


        /* =====================================================
           PAGE
        ===================================================== */

        .page {
            min-height: 100vh;

            display: flex;
            justify-content: center;

            padding: 55px 20px;

            position: relative;
            z-index: 2;
        }


        /* =====================================================
           MAIN CARD
        ===================================================== */

        .card {
            width: 100%;
            max-width: 570px;

            padding: 42px 28px 30px;

            border-radius: 30px;

            position: relative;

            background:
                linear-gradient(
                    145deg,
                    rgba(19, 9, 31, 0.91),
                    rgba(5, 4, 12, 0.94)
                );

            border:
                1px solid rgba(194, 79, 255, 0.28);

            box-shadow:
                0 0 50px rgba(116, 0, 255, 0.11),
                inset 0 0 50px rgba(144, 0, 255, 0.025);

            backdrop-filter: blur(22px);

            overflow: hidden;
        }


        /*
           Subtle light at top of card
        */

        .card::before {
            content: "";

            position: absolute;

            left: 10%;
            right: 10%;
            top: 0;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(216, 77, 255, 0.8),
                    rgba(75, 127, 255, 0.8),
                    transparent
                );

            box-shadow:
                0 0 15px rgba(200, 60, 255, 0.7);
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo-wrapper {
            display: flex;

            justify-content: center;
            align-items: center;

            margin-bottom: 17px;
        }


        .logo {
            width: 150px;
            height: 150px;

            display: block;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(204, 0, 255, 0.8)
                )
                drop-shadow(
                    0 0 25px
                    rgba(84, 77, 255, 0.42)
                );

            animation: logoGlow 4s ease-in-out infinite;
        }


        @keyframes logoGlow {

            0%, 100% {
                filter:
                    drop-shadow(
                        0 0 8px
                        rgba(204, 0, 255, 0.75)
                    )
                    drop-shadow(
                        0 0 22px
                        rgba(84, 77, 255, 0.38)
                    );
            }

            50% {
                filter:
                    drop-shadow(
                        0 0 14px
                        rgba(235, 0, 255, 0.95)
                    )
                    drop-shadow(
                        0 0 32px
                        rgba(62, 108, 255, 0.55)
                    );
            }
        }


        /* =====================================================
           NAME
        ===================================================== */

        h1 {
            text-align: center;

            direction: ltr;

            font-size: 43px;

            font-weight: 900;

            letter-spacing: 4px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff 0%,
                    #d65cff 35%,
                    #8f78ff 65%,
                    #ffffff 100%
                );

            background-size: 220% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation:
                nameGradient 5s linear infinite;
        }


        @keyframes nameGradient {

            to {
                background-position: 220% center;
            }
        }


        /* =====================================================
           DESCRIPTION
        ===================================================== */

        .description {
            max-width: 490px;

            margin:
                12px auto 0;

            text-align: center;

            direction: rtl;

            color:
                rgba(255, 255, 255, 0.72);

            font-size: 14px;

            line-height: 1.75;

            font-weight: 500;
        }


        /* =====================================================
           LINKS
        ===================================================== */

        .links {
            display: flex;

            flex-direction: column;

            gap: 13px;

            margin-top: 29px;
        }


        /* =====================================================
           LINK BUTTON
        ===================================================== */

        .link {
            width: 100%;
            min-height: 65px;

            display: flex;

            align-items: center;

            position: relative;

            padding: 0 21px;

            border-radius: 16px;

            color: white;

            text-decoration: none;

            overflow: hidden;

            background:
                linear-gradient(
                    100deg,
                    rgba(255,255,255,0.045),
                    rgba(255,255,255,0.012)
                );

            border:
                1px solid
                var(--border);

            box-shadow:
                inset 0 0 20px
                var(--inner-glow);

            transition:
                transform .22s ease,
                border-color .22s ease,
                box-shadow .22s ease,
                background .22s ease;
        }


        /*
           Colored glow line
        */

        .link::before {
            content: "";

            position: absolute;

            top: 0;
            bottom: 0;

            right: 0;

            width: 3px;

            background: var(--accent);

            box-shadow:
                0 0 12px var(--accent),
                0 0 25px var(--accent);

            opacity: .9;
        }


        /*
           Hover shine
        */

        .link::after {
            content: "";

            position: absolute;

            width: 140px;
            height: 100%;

            top: 0;
            left: -180px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.09),
                    transparent
                );

            transform: skewX(-20deg);

            transition:
                left .55s ease;
        }


        .link:hover::after {
            left: 110%;
        }


        .link:hover {
            transform: translateY(-3px);

            border-color:
                var(--accent);

            background:
                linear-gradient(
                    100deg,
                    var(--hover-bg),
                    rgba(255,255,255,0.025)
                );

            box-shadow:
                0 0 18px
                var(--outer-glow),

                inset 0 0 22px
                var(--inner-glow);
        }


        /* =====================================================
           ICON
        ===================================================== */

        .icon {
            width: 29px;
            height: 29px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin-left: 15px;

            color: var(--accent);

            flex-shrink: 0;

            filter:
                drop-shadow(
                    0 0 7px
                    var(--accent)
                );

            transition:
                transform .22s ease;
        }


        .link:hover .icon {
            transform:
                scale(1.1)
                rotate(-3deg);
        }


        .icon svg {
            width: 100%;
            height: 100%;
        }


        /* =====================================================
           TEXT
        ===================================================== */

        .link-name {
            font-size: 15px;

            font-weight: 900;

            letter-spacing: 1.4px;

            direction: ltr;
        }


        /* =====================================================
           INDIVIDUAL BUTTON COLORS
        ===================================================== */

        /*
           DISCORD
        */

        .discord {
            --accent: #7289da;
            --border: rgba(114,137,218,.35);
            --inner-glow: rgba(114,137,218,.05);
            --outer-glow: rgba(114,137,218,.25);
            --hover-bg: rgba(114,137,218,.10);
        }


        /*
           KICK
        */

        .kick {
            --accent: #53ff85;
            --border: rgba(83,255,133,.28);
            --inner-glow: rgba(83,255,133,.045);
            --outer-glow: rgba(83,255,133,.25);
            --hover-bg: rgba(83,255,133,.08);
        }


        /*
           TIKTOK
        */

        .tiktok {
            --accent: #25f4ee;
            --border: rgba(37,244,238,.28);
            --inner-glow: rgba(37,244,238,.04);
            --outer-glow: rgba(37,244,238,.22);
            --hover-bg: rgba(37,244,238,.07);
        }


        /*
           INSTAGRAM
        */

        .instagram {
            --accent: #ff4fa3;
            --border: rgba(255,79,163,.3);
            --inner-glow: rgba(255,79,163,.045);
            --outer-glow: rgba(255,79,163,.25);
            --hover-bg: rgba(255,79,163,.08);
        }


        /*
           YOUTUBE
        */

        .youtube {
            --accent: #ff4055;
            --border: rgba(255,64,85,.3);
            --inner-glow: rgba(255,64,85,.045);
            --outer-glow: rgba(255,64,85,.24);
            --hover-bg: rgba(255,64,85,.08);
        }


        /*
           TIPS
        */

        .tips {
            --accent: #ffd34e;
            --border: rgba(255,211,78,.28);
            --inner-glow: rgba(255,211,78,.045);
            --outer-glow: rgba(255,211,78,.23);
            --hover-bg: rgba(255,211,78,.08);
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {
            margin-top: 25px;

            text-align: center;

            direction: ltr;

            color:
                rgba(255,255,255,.25);

            font-size: 10px;

            letter-spacing: 1px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .page {
                padding:
                    25px 13px;
            }

            .card {
                padding:
                    32px 17px 25px;

                border-radius: 23px;
            }

            .logo {
                width: 132px;
                height: 132px;
            }

            h1 {
                font-size: 34px;
                letter-spacing: 3px;
            }

            .description {
                font-size: 13px;

                line-height: 1.8;

                padding:
                    0 5px;
            }

            .link {
                min-height: 61px;

                padding:
                    0 18px;
            }

            .icon {
                width: 26px;
                height: 26px;

                margin-left: 13px;
            }
        }


        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (prefers-reduced-motion: reduce) {

            .logo,
            h1,
            .topography,
            .glow {
                animation: none;
            }

            .link {
                transition: none;
            }
        }

    </style>
</head>


<body>
