<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHAKEDIM</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #fff;
            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(155, 0, 255, 0.22),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 10% 80%,
                    rgba(0, 100, 255, 0.14),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 65%,
                    rgba(255, 0, 200, 0.08),
                    transparent 30%
                ),
                #05030a;
        }

        /* BACKGROUND GRID */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background-image:
                linear-gradient(
                    rgba(150, 0, 255, 0.045) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(150, 0, 255, 0.045) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image: linear-gradient(
                to bottom,
                transparent,
                black 20%,
                black 80%,
                transparent
            );
        }

        /* PAGE */

        .page {
            min-height: 100vh;

            display: flex;
            justify-content: center;

            padding: 55px 20px;
        }

        /* MAIN CARD */

        .card {
            width: 100%;
            max-width: 560px;

            padding: 42px 28px 30px;

            position: relative;
            z-index: 2;

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(30, 10, 45, 0.94),
                    rgba(7, 5, 15, 0.96)
                );

            border: 1px solid rgba(190, 0, 255, 0.28);

            box-shadow:
                0 0 30px rgba(160, 0, 255, 0.12),
                inset 0 0 40px rgba(120, 0, 255, 0.035);

            backdrop-filter: blur(20px);
        }

        /* LOGO */

        .logo-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 20px;
        }

        .logo {
            width: 155px;
            height: 155px;

            display: block;

            object-fit: contain;

            filter:
                drop-shadow(0 0 8px rgba(190, 0, 255, 0.8))
                drop-shadow(0 0 22px rgba(80, 80, 255, 0.45));

            animation: logoGlow 4s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% {
                filter:
                    drop-shadow(0 0 8px rgba(190, 0, 255, 0.8))
                    drop-shadow(0 0 22px rgba(80, 80, 255, 0.45));
            }

            50% {
                filter:
                    drop-shadow(0 0 14px rgba(220, 0, 255, 0.95))
                    drop-shadow(0 0 30px rgba(50, 100, 255, 0.6));
            }
        }

        /* NAME */

        h1 {
            text-align: center;

            font-size: 42px;
            font-weight: 900;

            letter-spacing: 3px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #d900ff,
                    #8f5cff,
                    #ffffff
                );

            background-size: 250% auto;

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;

            animation: nameGradient 5s linear infinite;
        }

        @keyframes nameGradient {
            to {
                background-position: 250% center;
            }
        }

        /* SUBTITLE */

        .subtitle {
            margin-top: 8px;

            text-align: center;

            color: rgba(255, 255, 255, 0.62);

            font-size: 15px;
            letter-spacing: 1px;
        }

        /* LINKS */

        .links {
            display: flex;
            flex-direction: column;

            gap: 13px;

            margin-top: 30px;
        }

        /* LINK BUTTON */

        .link {
            width: 100%;
            min-height: 64px;

            display: flex;
            align-items: center;

            padding: 0 22px;

            position: relative;

            color: #fff;
            text-decoration: none;

            border-radius: 15px;

            background:
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.035),
                    rgba(255, 255, 255, 0.012)
                );

            border: 1px solid rgba(180, 0, 255, 0.28);

            transition:
                transform 0.2s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .link:hover {
            transform: translateY(-3px);

            border-color: rgba(210, 0, 255, 0.85);

            background:
                linear-gradient(
                    90deg,
                    rgba(150, 0, 255, 0.12),
                    rgba(0, 180, 255, 0.045)
                );

            box-shadow:
                0 0 14px rgba(170, 0, 255, 0.25),
                inset 0 0 18px rgba(150, 0, 255, 0.035);
        }

        /* ICON */

        .icon {
            width: 27px;
            height: 27px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 15px;

            color: #d400ff;

            flex-shrink: 0;
        }

        .icon svg {
            width: 100%;
            height: 100%;
        }

        /* TEXT */

        .link-name {
            font-size: 15px;
            font-weight: 800;

            letter-spacing: 1.2px;
        }

        /* FOOTER */

        .footer {
            margin-top: 25px;

            text-align: center;

            color: rgba(255, 255, 255, 0.30);

            font-size: 11px;
            letter-spacing: 1px;
        }

        /* MOBILE */

        @media (max-width: 600px) {

            .page {
                padding: 25px 13px;
            }

            .card {
                padding: 32px 17px 25px;

                border-radius: 22px;
            }

            .logo {
                width: 135px;
                height: 135px;
            }

            h1 {
                font-size: 34px;
            }

            .link {
                min-height: 60px;
            }
        }

        /* REDUCE ANIMATIONS FOR USERS WHO PREFER IT */

        @media (prefers-reduced-motion: reduce) {

            .logo,
            h1 {
                animation: none;
            }

            .link {
                transition: none;
            }
        }
    </style>
</head>
