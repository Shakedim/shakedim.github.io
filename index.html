<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHAKEDIM</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 50% 0%, rgba(150, 0, 255, 0.20), transparent 35%),
        radial-gradient(circle at 10% 80%, rgba(0, 100, 255, 0.12), transparent 30%),
        #05030a;
    overflow-x: hidden;
}

/* BACKGROUND GRID */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background-image:
        linear-gradient(rgba(150, 0, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(150, 0, 255, 0.045) 1px, transparent 1px);

    background-size: 45px 45px;

    mask-image: linear-gradient(
        to bottom,
        transparent,
        black 20%,
        black 80%,
        transparent
    );
}

/* PAGE */

.page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 55px 20px;
}

/* MAIN CARD */

.card {
    width: 100%;
    max-width: 560px;

    padding: 42px 28px 32px;

    border-radius: 28px;

    background:
        linear-gradient(
            145deg,
            rgba(30, 10, 45, 0.92),
            rgba(7, 5, 15, 0.95)
        );

    border: 1px solid rgba(190, 0, 255, 0.28);

    box-shadow:
        0 0 30px rgba(160, 0, 255, 0.12),
        inset 0 0 40px rgba(120, 0, 255, 0.035);

    backdrop-filter: blur(20px);

    position: relative;
    z-index: 2;
}

/* LOGO */

.logo-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 22px;
}

.logo {
    width: 155px;
    height: 155px;

    object-fit: contain;
    display: block;

    filter:
        drop-shadow(0 0 8px rgba(190, 0, 255, 0.8))
        drop-shadow(0 0 22px rgba(80, 80, 255, 0.45));

    animation: logoGlow 4s ease-in-out infinite;
}

@keyframes logoGlow {

    0%, 100% {
        filter:
            drop-shadow(0 0 8px rgba(190, 0, 255, 0.8))
            drop-shadow(0 0 22px rgba(80, 80, 255, 0.45));
    }

    50% {
        filter:
            drop-shadow(0 0 13px rgba(220, 0, 255, 0.95))
            drop-shadow(0 0 30px rgba(50, 100, 255, 0.6));
    }
}

/* NAME */

h1 {
    text-align: center;

    font-size: 42px;
    font-weight: 900;
    letter-spacing: 3px;

    background: linear-gradient(
        90deg,
        #ffffff,
        #d900ff,
        #8f5cff,
        #ffffff
    );

    background-size: 250% auto;

    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;

    animation: nameGradient 5s linear infinite;
}

@keyframes nameGradient {
    to {
        background-position: 250% center;
    }
}

/* BIO */

.subtitle {
    text-align: center;
    margin-top: 8px;

    color: rgba(255,255,255,0.62);

    font-size: 15px;
    letter-spacing: 1px;
}

/* LIVE STATUS */

.live-status {
    display: none;

    width: fit-content;

    margin: 18px auto 25px;
    padding: 8px 17px;

    border-radius: 999px;

    background: rgba(255, 0, 40, 0.08);

    border: 1px solid rgba(255, 0, 55, 0.65);

    color: #ff3854;

    font-size: 13px;
    font-weight: 900;

    letter-spacing: 1.5px;

    box-shadow:
        0 0 10px rgba(255, 0, 50, 0.45),
        inset 0 0 10px rgba(255, 0, 50, 0.05);

    animation: livePulse 1.5s ease-in-out infinite;
}

.live-status.active {
    display: flex;
    align-items: center;
    gap: 8px;
}

.live-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #ff183c;

    box-shadow:
        0 0 7px #ff183c,
        0 0 15px #ff183c;
}

@keyframes livePulse {

    0%, 100% {
        opacity: 1;
    }

    50% {
        opacity: 0.65;
    }
}

/* SOCIAL LINKS */

.links {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

/* BUTTON */

.link {
    width: 100%;
    min-height: 64px;

    display: flex;
    align-items: center;

    position: relative;

    padding: 0 22px;

    border-radius: 15px;

    text-decoration: none;
    color: white;

    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,0.035),
            rgba(255,255,255,0.015)
        );

    border: 1px solid rgba(180, 0, 255, 0.28);

    transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}

.link:hover {
    transform: translateY(-3px);

    border-color: rgba(210, 0, 255, 0.85);

    background:
        linear-gradient(
            90deg,
            rgba(150, 0, 255, 0.12),
            rgba(0, 180, 255, 0.045)
        );

    box-shadow:
        0 0 14px rgba(170, 0, 255, 0.25),
        inset 0 0 18px rgba(150, 0, 255, 0.035);
}

/* ICON */

.icon {
    width: 27px;
    height: 27px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-right: 15px;

    color: #d400ff;

    flex-shrink: 0;
}

.icon svg {
    width: 100%;
    height: 100%;
}

/* TEXT */

.link-name {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 1.2px;
}

/* KICK LIVE INDICATOR */

.kick-live {
    display: none;

    margin-left: auto;

    align-items: center;
    gap: 7px;

    color: #ff4057;

    font-size: 11px;
    font-weight: 900;

    letter-spacing: 1px;
}

.kick-live.active {
    display: flex;
}

.kick-live-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #ff183c;

    box-shadow:
        0 0 6px #ff183c,
        0 0 12px #ff183c;
}

/* FOOTER */

.footer {
    text-align: center;

    margin-top: 25px;

    color: rgba(255,255,255,0.30);

    font-size: 11px;
    letter-spacing: 1px;
}

/* MOBILE */

@media (max-width: 600px) {

    .page {
        padding: 25px 13px;
    }

    .card {
        padding: 32px 17px 25px;
        border-radius: 22px;
    }

    .logo {
        width: 135px;
        height: 135px;
    }

    h1 {
        font-size: 34px;
    }

    .link {
        min-height: 60px;
    }
}
</style>
</head>

<body>

<script>

/*
===========================================================
KICK LIVE STATUS
===========================================================

IMPORTANT:

Change this URL after you create your Cloudflare Worker.

Example:

const LIVE_API =
    "https://shakedim-live.your-subdomain.workers.dev";

===========================================================
*/

const LIVE_API = "YOUR_CLOUDFLARE_WORKER_URL";


const liveStatus = document.getElementById("liveStatus");
const kickLive = document.getElementById("kickLive");


function setLiveStatus(isLive) {

    if (isLive) {

        liveStatus.classList.add("active");

        kickLive.classList.add("active");

    } else {

        liveStatus.classList.remove("active");

        kickLive.classList.remove("active");

    }
}


async function checkLiveStatus() {

    try {

        const response = await fetch(
            LIVE_API + "?channel=shakedim",
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error("Live API error");
        }

        const data = await response.json();

        setLiveStatus(data.live === true);

    } catch (error) {

        /*
         If the status server is unavailable,
         don't incorrectly show LIVE.
        */

        setLiveStatus(false);

        console.log("Could not check Kick live status.");

    }
}


/*
Check immediately when the page loads.
*/
checkLiveStatus();


/*
Check every 30 seconds.
*/
setInterval(
    checkLiveStatus,
    30 * 1000
);

</script>
